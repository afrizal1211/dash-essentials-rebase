[package]
name = "dash-essential-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "dash_essential_backend"
path = "src/lib.rs"

[[bin]]
name = "dash_daemon"
path = "src/bin/dash_essentiald.rs"

[[bin]]
name = "dash_ctl"
path = "src/bin/dash_essentialctl.rs"
