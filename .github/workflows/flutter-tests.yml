name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: "3.12.0"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Get Flutter dependencies
        working-directory: ui/flutter
        run: flutter pub get

      - name: Run unit tests
        working-directory: ui/flutter
        run: |
          flutter test --no-pub --coverage
          # optional: upload coverage
          # bash <(curl -s https://codecov.io/bash) -f coverage/lcov.info

      - name: Analyze code (optional)
        working-directory: ui/flutter
        run: flutter analyze
